version: '3.8'

services:
  pd:
    image: pingcap/pd:v7.1.0
    container_name: pd
    ports:
      - "2379:2379"
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - pd-data:/data

  tikv:
    image: pingcap/tikv:v7.1.0
    container_name: tikv
    ports:
      - "20160:20160"
    depends_on:
      - pd
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
    volumes:
      - tikv-data:/data

  tidb:
    image: pingcap/tidb:v7.1.0
    container_name: tidb
    ports:
      - "4000:4000"
    depends_on:
      - pd
      - tikv
    command:
      - --store=tikv
      - --path=pd:2379
    environment:
      - TZ=UTC

volumes:
  pd-data:
  tikv-data:
